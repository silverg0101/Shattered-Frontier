services:
  # Joins the tailnet so the app can SSH to GPU hosts on other networks. Only this
  # stack's network namespace gets the tunnel; the steam-server itself is untouched.
  tailscale:
    image: tailscale/tailscale:v1.84.0
    hostname: asset-manager
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}  # from .env; without it the app runs LAN-only
      # --accept-routes: reach GPU hosts through the tailnet's subnet routes (e.g. 192.168.0.0/24)
      TS_EXTRA_ARGS: --login-server=${TS_LOGIN_SERVER:-https://vpn-tailscale.realauction.com} --accept-routes
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - ${DATA_ROOT:-/mnt/ssd2/asset-manager/data}/tailscale:/var/lib/tailscale
    devices: ["/dev/net/tun:/dev/net/tun"]
    cap_add: [NET_ADMIN]
    ports: ["8090:8090"]

  asset-manager:
    build: .
    restart: unless-stopped
    network_mode: service:tailscale
    volumes:
      - ${DATA_ROOT:-/mnt/ssd2/asset-manager/data}:/data
      - ${SSH_DIR:-./ssh}:/ssh:ro
