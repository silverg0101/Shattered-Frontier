<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frontier Assets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
:root {
  --background: hsl(220, 14%, 8%);
  --foreground: hsl(210, 16%, 95%);
  --primary: hsl(206, 100%, 52%);
  --primary-30: hsla(206, 100%, 52%, .3);
  --primary-12: hsla(206, 100%, 52%, .12);
  --primary-foreground: #fff;
  --muted-foreground: hsl(215, 10%, 58%);
  --border: hsl(220, 12%, 20%);
  --card: hsl(220, 13%, 12%);
  --card-elevated: hsl(220, 12%, 16%);
  --success: hsl(152, 62%, 44%);
  --danger: hsl(355, 78%, 58%);
  --warn: hsl(38, 92%, 56%);
  --deep: hsl(220, 16%, 5%);
  --ease: cubic-bezier(.22, 1, .36, 1);
  --display: 'Sora', system-ui, sans-serif;
  --sans: 'Inter', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--background); color: var(--foreground); font: 400 14px/1.6 var(--sans); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
textarea { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); outline: none; width: 100%; }
a { color: var(--primary); text-decoration: none; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; border: 2px solid var(--background); }

.app { display: grid; grid-template-columns: 224px 1fr auto; grid-template-rows: minmax(0, 1fr); height: 100vh; }  /* one row capped at the window, so .view scrolls instead of growing */

/* ---- left menu */
nav.side { background: var(--deep); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 22px 14px; gap: 4px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 26px; }
.brand b { font: 800 20px/1 var(--display); letter-spacing: -.035em; }
.brand small { display: block; font: 600 9px/1 var(--sans); letter-spacing: .28em; color: var(--muted-foreground); margin-top: 5px; }
.brand svg { color: var(--primary); filter: drop-shadow(0 0 8px var(--primary-30)); }
nav.side a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; color: var(--muted-foreground); font-weight: 500; transition: background .25s, color .25s; }
nav.side a:hover { background: var(--card); color: var(--foreground); }
nav.side a.on { background: var(--primary-12); color: var(--foreground); box-shadow: inset 2px 0 0 var(--primary); }
nav.side a.on svg { color: var(--primary); }
nav.side .foot { margin-top: auto; padding: 10px 12px; font-size: 11px; color: var(--muted-foreground); }

/* ---- main */
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
header.top { height: 64px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 28px; border-bottom: 1px solid var(--border); background: hsla(220, 14%, 8%, .92); backdrop-filter: blur(10px); }
.crumbs { display: flex; align-items: center; gap: 6px; font: 600 13px var(--display); min-width: 0; overflow: hidden; white-space: nowrap; }
.crumbs a { color: var(--muted-foreground); padding: 4px 6px; border-radius: 6px; transition: color .2s, background .2s; }
.crumbs a:hover { color: var(--foreground); background: var(--card); }
.crumbs a:last-child { color: var(--foreground); }
.crumbs i { color: var(--border); font-style: normal; }
.view { flex: 1; min-height: 0; overflow: auto; padding: 28px; }
.eyebrow { font: 600 11px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--primary); }
h2 { font: 700 32px/1.1 var(--display); letter-spacing: -.025em; margin: 10px 0 0; }
h3 { font: 600 18px/1.2 var(--display); margin: 0; }
.muted { color: var(--muted-foreground); }
.fade { animation: fadeUp .6s var(--ease) both; animation-delay: calc(var(--i, 0) * 40ms); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }

.btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-weight: 500; font-size: 13px; transition: border-color .25s, background .25s, box-shadow .25s; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--primary-30); background: var(--card-elevated); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); font-weight: 600; }
.btn.primary:hover:not(:disabled) { box-shadow: 0 0 24px var(--primary-30); background: var(--primary); }
.btn.danger:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }
.btn.icon { width: 36px; padding: 0; justify-content: center; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
input[type=text], input[type=number], input[type=search], select { height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); outline: none; transition: border-color .2s, box-shadow .2s; width: 100%; }
input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-12); }
input[type=checkbox] { accent-color: var(--primary); width: 16px; height: 16px; }

/* ---- assets */
.assets { display: grid; grid-template-columns: 1fr 380px; gap: 24px; height: 100%; }
.assets.nopreview { grid-template-columns: 1fr; }
.pane { min-width: 0; display: flex; flex-direction: column; }
.toolbar { position: sticky; top: -28px; z-index: 5; margin: 0 -28px; padding: 14px 28px; background: hsla(220, 14%, 8%, .95); backdrop-filter: blur(10px); border-block: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar .search { width: 220px; margin-left: auto; }
.toolbar .count { font-size: 12px; color: var(--muted-foreground); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--tile, 168px), 1fr)); gap: 16px; padding: 20px 0; align-content: start; flex: 1; border-radius: 16px; transition: background .2s, outline-color .2s; outline: 2px dashed transparent; outline-offset: -2px; }
.grid.drop { background: var(--primary-12); outline-color: var(--primary); }
.tile { position: relative; overflow: hidden; border-radius: 12px; border: 1px solid var(--border); background: var(--card); cursor: pointer; user-select: none; transition: border-color .25s, box-shadow .25s; }
.tile:hover { border-color: var(--primary-30); }
.tile.sel { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary), 0 0 24px var(--primary-12); }
.tile .thumb { position: relative; aspect-ratio: 1; display: grid; place-items: center; overflow: hidden; background: radial-gradient(circle at 50% 30%, var(--card-elevated), var(--card)); }
.tile .thumb img { width: 100%; height: 100%; object-fit: contain; transition: transform .7s var(--ease); }
.tile:hover .thumb img { transform: scale(1.05); }
.tile .thumb svg { width: 44px; height: 44px; color: var(--muted-foreground); transition: transform .7s var(--ease), color .25s; }
.tile:hover .thumb svg { transform: scale(1.08); color: var(--primary); }
.tile .meta { padding: 9px 11px 11px; }
.tile .name { font: 600 13px/1.3 var(--display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .sub { font-size: 11px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.tile .check { position: absolute; top: 8px; left: 8px; opacity: 0; transition: opacity .2s; }
.tile:hover .check, .tile.sel .check, .grid.multi .check { opacity: 1; }
.badge { position: absolute; top: 8px; right: 8px; border-radius: 999px; padding: 2px 8px; font: 600 10px/1.6 var(--sans); letter-spacing: .08em; text-transform: uppercase; background: hsla(220, 14%, 8%, .8); backdrop-filter: blur(6px); color: var(--muted-foreground); }
.badge.model { background: var(--primary); color: #fff; }
/* joint detector state on rigged models: good / usable / failed, neutral while none, queued or training */
.det { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 8px; font: 600 10px/1.6 var(--sans); letter-spacing: .08em; text-transform: uppercase; background: hsla(220, 14%, 8%, .8); backdrop-filter: blur(6px); color: var(--muted-foreground); white-space: nowrap; }
.tile .det { position: absolute; left: 8px; bottom: 8px; cursor: pointer; }
.det.good { background: var(--success); color: #04180f; }
.det.usable { background: var(--warn); color: #241600; }
.det.failed { background: var(--danger); color: #fff; }
.det .spin { width: 8px; height: 8px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.dettab { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; margin-top: 8px; }
.dettab th, .dettab td { text-align: right; padding: 3px 6px; border-bottom: 1px solid var(--border); }
.dettab th:first-child, .dettab td:first-child { text-align: left; }
.dettab th { font-weight: 500; color: var(--muted-foreground); }
.dettab .good { color: var(--success); } .dettab .usable { color: var(--warn); } .dettab .failed { color: var(--danger); }
.empty { grid-column: 1 / -1; text-align: center; padding: 70px 20px; color: var(--muted-foreground); border: 1px dashed var(--border); border-radius: 16px; }

.preview { position: sticky; top: 0; align-self: start; border: 1px solid var(--border); border-radius: 16px; background: var(--card-elevated); overflow: hidden; max-height: calc(100vh - 120px); display: flex; flex-direction: column; }
.preview .stage { aspect-ratio: 1; background: radial-gradient(circle at 50% 35%, hsl(220, 12%, 20%), var(--deep)); display: grid; place-items: center; }
.preview .stage img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; }
.viewer { position: relative; width: 100%; height: 100%; align-self: stretch; justify-self: stretch; }
.viewer canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.viewer .vbusy { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted-foreground); font-size: 13px; }
.vmodes { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.vmodes button { border: 1px solid var(--border); background: var(--card); color: var(--muted-foreground); border-radius: 999px; padding: 3px 10px; font: 600 11px var(--sans); cursor: pointer; transition: background .2s, color .2s, border-color .2s; }
.vmodes button:hover:not(:disabled) { border-color: var(--primary-30); color: var(--foreground); }
.vmodes button.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.vmodes button:disabled { opacity: .35; cursor: default; }
.preview .info { padding: 18px 20px; overflow: auto; min-height: 0; }  /* min-height lets it shrink and scroll */
.preview .stage, .preview .vmodes { flex-shrink: 0; }
.preview dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 14px 0; font-size: 12px; }
.preview dt { color: var(--muted-foreground); }
.preview dd { margin: 0; font-variant-numeric: tabular-nums; word-break: break-all; }
.preview .acts { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---- create */
.types { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin: 22px 0 26px; }
.type { text-align: left; padding: 18px; border-radius: 14px; border: 1px solid var(--border); background: var(--card); cursor: pointer; transition: border-color .25s, box-shadow .25s; }
.type.on { border-color: var(--primary); box-shadow: 0 0 28px var(--primary-12); }
.type:disabled { opacity: .45; cursor: default; }
.type svg { color: var(--primary); }
.type h3 { margin: 12px 0 4px; }
.form { display: grid; grid-template-columns: minmax(300px, 440px) minmax(0, 1fr); gap: 24px; align-items: start; }
.form > *, .views > * { min-width: 0; }
.card { border: 1px solid var(--border); border-radius: 16px; background: var(--card-elevated); padding: 22px; }
.src { aspect-ratio: 1; border-radius: 12px; border: 1px dashed var(--border); display: grid; place-items: center; overflow: hidden; background: var(--card); margin: 14px 0; color: var(--muted-foreground); text-align: center; transition: border-color .2s, background .2s; }
.src.drop { border-color: var(--primary); background: var(--primary-12); }
.src img { width: 100%; height: 100%; object-fit: contain; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px 18px; margin-top: 14px; }
.field label { display: block; font: 600 11px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted-foreground); margin-bottom: 8px; }
.field.check { display: flex; align-items: center; gap: 10px; padding-top: 22px; }
.field.check label { margin: 0; }
details.sec { border-top: 1px solid var(--border); padding: 14px 0 4px; margin-top: 18px; }
details.sec summary { cursor: pointer; font: 600 15px var(--display); list-style: none; display: flex; align-items: center; gap: 8px; }
details.sec summary::before { content: '›'; color: var(--primary); font-size: 18px; transition: transform .25s; }
details.sec[open] summary::before { transform: rotate(90deg); }

.seg { display: inline-flex; padding: 3px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); }
.seg button { border: 0; background: none; padding: 5px 14px; border-radius: 999px; font: 600 12px var(--sans); color: var(--muted-foreground); cursor: pointer; transition: background .25s, color .25s; }
.seg button.on { background: var(--primary); color: #fff; box-shadow: 0 0 16px var(--primary-30); }
.views { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
.slot .src { margin: 6px 0; font-size: 12px; }
.slotlbl { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font-size: 12px; }
.slotlbl b { font: 600 13px var(--display); }
.slotlbl span { color: var(--muted-foreground); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.slotacts { display: flex; flex-wrap: wrap; gap: 6px; }
.slotacts .btn:not(.icon) { flex: 1 1 auto; justify-content: center; padding: 0 8px; }
[hidden] { display: none !important; }

/* ---- settings */
table.hosts { width: 100%; border-collapse: collapse; margin-top: 12px; }
table.hosts th { text-align: left; font: 600 11px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted-foreground); padding: 8px 6px; }
table.hosts td { padding: 6px; vertical-align: middle; }
table.hosts input[type=text], table.hosts input[type=number] { height: 34px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; background: var(--muted-foreground); }
.dot.ok { background: var(--success); box-shadow: 0 0 8px var(--success); }
.dot.bad { background: var(--danger); }
.dot.busy { background: var(--warn); }

/* ---- queue flyout */
aside.queue { width: 380px; border-left: 1px solid var(--border); background: var(--deep); display: flex; flex-direction: column; transition: width .35s var(--ease); overflow: hidden; }
aside.queue.closed { width: 52px; }
.qhead { height: 64px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
aside.queue.closed .qhead { padding: 0 8px; justify-content: center; }
aside.queue.closed .qhide { display: none; }
.qcount { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--primary); color: #fff; font: 700 11px/20px var(--display); text-align: center; }
.qbody { flex: 1; overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
aside.queue.closed .qbody { display: none; }
.vtab { display: none; writing-mode: vertical-rl; font: 600 11px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--muted-foreground); margin: 18px auto; cursor: pointer; }
aside.queue.closed .vtab { display: block; }
.job { border: 1px solid var(--border); border-radius: 12px; background: var(--card); padding: 12px 14px; animation: fadeUp .45s var(--ease) both; }
.job.running { border-color: var(--primary-30); box-shadow: 0 0 24px var(--primary-12); }
.job .row { display: flex; align-items: center; gap: 8px; }
.job .title { font: 600 14px var(--display); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { font: 600 10px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; padding: 5px 8px; border-radius: 999px; background: var(--card-elevated); color: var(--muted-foreground); }
.pill.running { background: var(--primary); color: #fff; animation: pulse 1.6s ease-in-out infinite; }
.pill.done { background: var(--success); color: #04180f; }
.pill.failed { background: var(--danger); color: #fff; }
.pill.cancelling, .pill.cancelled { background: var(--warn); color: #241600; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px var(--primary-30); } }
.job .sub { font-size: 11px; color: var(--muted-foreground); margin-top: 4px; font-variant-numeric: tabular-nums; }
.job .err { font-size: 12px; color: var(--danger); margin-top: 6px; word-break: break-word; }
.metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin-top: 10px; }
.metric { font-size: 11px; }
.metric .lbl { display: flex; justify-content: space-between; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.metric .lbl b { color: var(--foreground); font: 700 11px var(--display); }
.bar { height: 4px; border-radius: 4px; background: var(--card-elevated); overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--primary); border-radius: 4px; transition: width .6s var(--ease); }
.log { margin-top: 10px; border-radius: 8px; background: var(--deep); border: 1px solid var(--border); font: 11px/1.5 ui-monospace, Consolas, monospace; color: hsl(210, 16%, 80%); }
.log pre { margin: 0; padding: 8px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log.open pre { white-space: pre-wrap; word-break: break-all; max-height: 320px; overflow: auto; }
.log .lbar { display: flex; align-items: center; gap: 10px; padding: 4px 8px; border-top: 1px solid var(--border); font: 11px var(--sans); color: var(--muted-foreground); }
.log .lbar label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
.log .lbar input { width: 13px; height: 13px; }
.job .acts { display: flex; gap: 6px; margin-top: 10px; }

/* ---- modal, lightbox, toast */
.overlay { position: fixed; inset: 0; z-index: 50; background: hsla(220, 16%, 4%, .75); backdrop-filter: blur(6px); display: grid; place-items: center; padding: 20px; animation: fadeIn .2s both; }
@keyframes fadeIn { from { opacity: 0; } }
.modal { width: min(560px, 100%); max-height: 80vh; display: flex; flex-direction: column; background: var(--card-elevated); border: 1px solid var(--border); border-radius: 18px; padding: 22px; animation: pop .3s var(--ease) both; }
@keyframes pop { from { opacity: 0; transform: scale(.97); } }
.modal .list { flex: 1; overflow: auto; margin: 14px 0; border: 1px solid var(--border); border-radius: 12px; background: var(--card); }
.modal .item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer; border-bottom: 1px solid var(--border); }
.modal .item:hover { background: var(--primary-12); }
.modal .item img { width: 36px; height: 36px; object-fit: cover; border-radius: 6px; }
.modal .foot { display: flex; justify-content: flex-end; gap: 8px; }
.lightbox img { max-width: 92vw; max-height: 90vh; border-radius: 12px; box-shadow: 0 0 60px var(--primary-12); }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 60; padding: 10px 18px; border-radius: 999px; background: var(--card-elevated); border: 1px solid var(--border); box-shadow: 0 10px 30px #0008; animation: fadeUp .35s var(--ease) both; }
.toast.err { border-color: var(--danger); color: var(--danger); }

@media (max-width: 1100px) { .assets { grid-template-columns: 1fr; } .preview { position: static; } .form { grid-template-columns: 1fr; } }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  nav.side { flex-direction: row; padding: 8px 16px; overflow-x: auto; }
  nav.side .brand, nav.side .foot { display: none; }
  aside.queue { position: fixed; right: 0; top: 0; bottom: 0; z-index: 40; max-width: 100vw; }
  .view { padding: 20px 16px; } header.top { padding: 0 16px; } .toolbar { margin: 0 -16px; padding: 12px 16px; } .toolbar .search { width: 100%; }
}
</style>
</head>
<body>
<div class="app">
  <nav class="side">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l8-10 8 10"/><path d="M8 17l4-5 4 5"/></svg>
      <div><b>FRONTIER</b><small>ASSET FORGE</small></div>
    </div>
    <a href="#/assets" data-nav="assets"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>Assets</a>
    <a href="#/create" data-nav="create"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>Create</a>

<script>

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: opts.body && !(opts.body instanceof Blob) ? { 'Content-Type': 'application/json' } : {} });
  const j = await r.json().catch(() => ({}));

}
const post = (p, b) => api(p, { method: 'POST', body: JSON.stringify(b || {}) });

  document.body.append(t); setTimeout(() => t.remove(), 3500);
}
const fail = e => toast(e.message, true);

const ICON = {
  dir: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>',
  model: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>',
  file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6"/></svg>',
  image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>',
  video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>',
};

/* ---------------- router */
const state = { path: '', entries: [], sel: new Set(), anchor: null, focus: null, filter: '', createImage: store.get('createImage', null) };
function route() {
  const h = location.hash.slice(2) || 'assets';
  const [page, ...rest] = h.split('/');
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === page));
  if (page === 'create') return rest[0] === 'images' ? renderImages() : renderCreate();
  if (page === 'settings') return renderSettings();

}
function crumbs(parts) {

}
const assetHref = p => '#/assets/' + p.split('/').filter(Boolean).map(encodeURIComponent).join('/');

/* ---------------- assets */
async function renderAssets() {
  const segs = state.path.split('/').filter(Boolean);
  crumbs([['Assets', '#/assets'], ...segs.map((s, i) => [s, assetHref(segs.slice(0, i + 1).join('/'))])]);

  $('#view').innerHTML = `
    <div class="assets nopreview" id="assets">
      <div class="pane">
        <div class="eyebrow">Asset library</div>
        <h2 style="margin-bottom:18px">${esc(segs.at(-1) || 'All assets')}</h2>
        <div class="toolbar">
          ${segs.length ? `<button class="btn icon" id="up" title="Up one folder"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>` : ''}
          <button class="btn" id="mkdir">+ New folder</button>
          <button class="btn" id="upload">Upload</button>
          <input type="file" id="files" multiple hidden>
          <button class="btn" id="move" disabled>Move</button>
          <button class="btn" id="rename" disabled>Rename</button>
          <button class="btn danger" id="del" disabled>Delete</button>
          <span class="count" id="count"></span>
          <input type="search" class="search" id="filter" placeholder="Filter this folder…" value="${esc(state.filter)}">
        </div>
        <div class="grid" id="grid"></div>
      </div>
      <div id="preview"></div>
    </div>`;
  drawGrid();
  $('#up')?.addEventListener('click', () => location.hash = assetHref(segs.slice(0, -1).join('/')));
  $('#mkdir').onclick = async () => {
    const name = prompt('New folder name'); if (!name) return;
    post('/api/mkdir', { path: join(state.path, name) }).then(renderAssets, fail);
  };

  $('#files').onchange = e => uploadFiles([...e.target.files]);
  $('#move').onclick = () => pickFolder('Move ' + state.sel.size + ' item(s) to…').then(dest => dest !== null &&
    post('/api/move', { paths: [...state.sel], dest }).then(() => { toast('Moved'); renderAssets(); }, fail));

const join = (a, b) => [a, b].filter(Boolean).join('/');
const visible = () => state.entries.filter(e => e.name.toLowerCase().includes(state.filter.toLowerCase()));

}
const byPath = p => state.entries.find(e => e.path === p);

}

    <div class="info"><div class="eyebrow">${esc(e.kind === 'dir' ? 'Folder' : e.kind)}</div><h3 style="margin-top:8px;word-break:break-all">${esc(e.name)}</h3>

  $('#rig') && ($('#rig').onclick = () => queueJob('rig', 'Rig ' + e.name, ['rig_format', 'rig_skeleton'], '3d'));
  $('#use') && ($('#use').onclick = () => { setCreateImage(e.path); location.hash = '#/create'; });
}
/* ---------------- joint detector (rigged models; it drives motion jobs) */
const DET_LABEL = { none: 'No detector', queued: 'Detector queued', training: 'Training', good: 'Detector good', usable: 'Detector usable', failed: 'Detector failed' };
const detBadge = (st, onTile) => `<span class="det ${esc(st)}" title="Joint detector: ${esc(st)}">${st === 'training' ? '<i class="spin"></i>' : ''}${onTile ? esc(DET_LABEL[st] || st) : esc(st)}</span>`;
const EXAM_ROWS = [['median', 'Median error'], ['p95', '95th percentile'], ['worst_joint', 'Worst joint'], ['pair_spacing', 'Left/right spacing']];
async function drawDetector(path) {
  const box = $('#det'); if (!box) return;
  let d, s;
  try { [d, s] = await Promise.all([api('/api/detector?model=' + encodeURIComponent(path)), api('/api/settings')]); }
  catch (err) { box.textContent = 'Detector: ' + err.message; return; }

  const lim = s.detector_limits, x = s.detector_usable_x, busy = d.state === 'queued' || d.state === 'training';
  const band = (k, v) => v == null ? 'failed' : v <= lim[k] ? 'good' : v <= lim[k] * x ? 'usable' : 'failed';
  const pct = v => v == null ? '—' : (+v).toFixed(2) + '%';
  box.innerHTML = `<div style="display:flex;align-items:center;gap:10px"><div class="eyebrow">Joint detector</div>${detBadge(d.state)}</div>
    ${d.exam ? `<table class="dettab"><tr><th>Exam (% of height)</th><th>Result</th><th>Good ≤</th><th>Usable ≤</th></tr>
      ${EXAM_ROWS.map(([k, l]) => `<tr><td>${l}</td><td class="${band(k, d.exam[k])}">${pct(d.exam[k])}</td><td>${pct(lim[k])}</td><td>${pct(lim[k] * x)}</td></tr>`).join('')}</table>
      ${d.worst_joints?.length ? `<table class="dettab"><tr><th>Worst joints</th><th>Mean</th><th title="front view only">x</th><th title="side view only: depth">y (depth)</th><th title="both views">z</th></tr>
        ${d.worst_joints.map(j => `<tr><td>${esc(j.joint)}</td><td>${pct(j.mean)}</td><td>${pct(j.x)}</td><td>${pct(j.y)}</td><td>${pct(j.z)}</td></tr>`).join('')}</table>` : ''}
      <dl style="margin-top:8px">
        ${d.last_take ? `<dt>Last take</dt><dd>score ${(+d.last_take.score).toFixed(2)} · height error ${pct(d.last_take.height_error_pct)} · job #${d.last_take.job}</dd>` : ''}

      </dl>`
    : `<div class="muted" style="font-size:12px;margin-top:6px">${busy ? 'Training a detector for this model: about 20 minutes.' : 'No detector yet. A motion job trains one first; training it now saves that time.'}</div>`}
    <button class="btn sm" id="retrain" style="margin-top:10px" ${busy ? 'disabled' : ''}>${d.exam ? 'Retrain detector' : 'Train detector'}</button>
    ${d.exam ? '<div class="muted" style="font-size:11px;margin-top:4px">A retrain defaults to twice the Settings renders and 60 epochs, about 35 minutes. The better detector of the old and new is kept.</div>' : ''}`;
  $('#retrain').onclick = async () => {
    try {
      const r = await api('/api/schema'), params = await optionsModal((d.exam ? 'Retrain' : 'Train') + ' detector', r.detector || []);

}

/* ---------------- 3D viewer (three.js): textured / clay / wireframe / UV checker / UV layout / normals / skeleton */
let viewer = null;
const VIEW_MODES = [['textured', 'Textured'], ['clay', 'Clay'], ['wire', 'Wireframe'], ['uvcheck', 'UV checker'], ['uvlayout', 'UV layout'], ['normals', 'Normals'], ['skeleton', 'Skeleton']];

  }

async function mountViewer(el, url, entry) {

      if (!(p.modes || ['single', 'multi']).includes(mode)) continue;
      const el = $('#p_' + p.key);
      params[p.key] = p.kind === 'bool' ? el.checked : p.kind === 'choice' ? (typeof p.default === 'number' ? +el.value : el.value) : +el.value;
    }
    const name = $('#jname').value.trim();
    store.set('createParams', { ...store.get('createParams', {}), ...params, image: undefined, views: undefined, preset: undefined, _name: '' });
    try { await post('/api/jobs', { kind: '3d', name, params }); toast('Added to queue'); setQueueOpen(true); pollQueue(); } catch (e) { fail(e); }
  };
}

/* ---------------- create: images (ChatGPT) */
const imagesType = on => `<button class="type ${on ? 'on' : ''}" onclick="location.hash='#/create/images'">${ICON.image.replace('<svg', '<svg width="28" height="28"')}<h3>Images</h3>
  <div class="muted" style="font-size:12px">Prompt → source image(s) · ChatGPT</div></button>`;
async function renderImages() {
  crumbs([['Create', '#/create'], ['Images', '#/create/images']]);
  let cx; try { cx = await api('/api/codex'); } catch (e) { return fail(e); }
  let mode = store.get('imageMode', 'single');
  const draft = store.get('imageDraft', {});
  $('#view').innerHTML = `
    <div class="eyebrow fade">New job</div>
    <h2 class="fade" style="--i:1">Create</h2>
    <div class="types fade" style="--i:2">
      <button class="type" onclick="location.hash='#/create'">${ICON.model.replace('<svg', '<svg width="28" height="28"')}<h3>3D Asset</h3><div class="muted" style="font-size:12px">Image(s) → textured GLB</div></button>
      ${imagesType(true)}
    </div>
    <div class="card fade" style="--i:3;margin-top:18px;max-width:760px">
      ${cx.signed_in ? '' : `<div class="err" style="margin-bottom:14px">ChatGPT is not signed in. <a href="#/settings">Sign in under Settings</a> first.</div>`}
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><div class="eyebrow">Image(s)</div>
        <div class="seg"><button data-imode="single">Single</button><button data-imode="multi">Multi-view</button></div></div>
      <div class="muted" style="font-size:12px;margin-top:10px" id="inote"></div>
      <div class="fields" style="margin-top:14px">
        <div class="field"><label for="imodel">Model</label><select id="imodel">${cx.models.map(m => `<option ${m === draft.model ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select></div>
      </div>
      <div class="field" style="margin-top:14px"><label for="iprompt">Prompt</label><textarea id="iprompt" rows="6" style="width:100%;resize:vertical">${esc(draft.prompt || '')}</textarea></div>
      <div class="field" style="margin-top:14px"><label for="iname">Asset name</label><input type="text" id="iname" value="${esc(draft.name || '')}" placeholder="Greenlands - Rat"></div>
      <button class="btn primary" id="isubmit" style="width:100%;justify-content:center;margin-top:18px;height:44px">Add to queue</button>
    </div>`;
  const setMode = m => {
    mode = m; store.set('imageMode', m);
    document.querySelectorAll('[data-imode]').forEach(b => b.classList.toggle('on', b.dataset.imode === m));
    $('#inote').textContent = m === 'single' ? 'One image. The prompt is sent exactly as written.'
      : 'Four views for a multi-view 3D asset, drawn together on one turnaround sheet so they share one pose and scale. The app cuts the sheet into views, matches their height and feet line, and has the set reviewed; a failed sheet is redrawn (up to 3 tries).';
  };
  document.querySelectorAll('[data-imode]').forEach(b => b.onclick = () => setMode(b.dataset.imode));
  setMode(mode);
  const keep = () => store.set('imageDraft', { model: $('#imodel').value, prompt: $('#iprompt').value, name: $('#iname').value });
  ['#imodel', '#iprompt', '#iname'].forEach(s => $(s).addEventListener('input', keep));
  $('#isubmit').onclick = async () => {
    const prompt = $('#iprompt').value.trim(), name = $('#iname').value.trim();
    if (!prompt) return toast('Write a prompt first', true);
    if (!name) return toast('Give it an asset name', true);
    try {
      await post('/api/jobs', { kind: 'image', name, params: { mode, model: $('#imodel').value, prompt } });
      toast('Added to queue'); setQueueOpen(true); pollQueue();
    } catch (e) { fail(e); }
  };
}
// A finished image job's files become the 3D Asset form's source: one image, or views by their -front/-left/... suffix.
function useImages(job) {
  const paths = job.files.map(f => f.path);
  const views = Object.fromEntries(POSITIONS.map(([pos]) => [pos, paths.find(p => p.endsWith(`-${pos}.png`))]).filter(([, p]) => p));
  if (views.front && Object.keys(views).length > 1) { store.set('createViews', views); store.set('createMode', 'multi'); }
  else { setCreateImage(paths[0]); store.set('createMode', 'single'); }
  store.set('createParams', { ...store.get('createParams', {}), _name: job.name });
  location.hash = '#/create';
}

/* ---------------- settings */
async function renderSettings() {
  crumbs([['Settings', '#/settings']]);
  let s; try { s = await api('/api/settings'); } catch (e) { return fail(e); }
  const row = (h, i) => {
    const direct = h.kind === 'http', inp = (f, v, t = 'text') => `<input type="${t}" data-f="${f}" value="${esc(v ?? '')}">`;
    return `<tr data-i="${i}">
    <td><span class="dot" data-dot></span></td>
    <td><input type="checkbox" data-f="enabled" ${h.enabled ? 'checked' : ''}></td>
    <td>${inp('name', h.name)}</td>
    <td style="width:110px"><select data-f="kind" data-kind><option value="ssh" ${direct ? '' : 'selected'}>SSH</option><option value="http" ${direct ? 'selected' : ''}>ComfyUI URL</option></select></td>
    <td>${direct ? inp('url', h.url || 'http://host:8188') : inp('ssh', h.ssh)}</td>
    <td style="width:70px">${inp('gpu', h.gpu ?? 0, 'number')}</td>
    <td style="width:90px">${direct ? '<span class="muted">in URL</span>' : inp('port', h.port, 'number')}</td>
    <td>${direct ? '<span class="muted">—</span>' : inp('comfy_dir', h.comfy_dir)}</td>
    <td>${direct ? '<span class="muted">ComfyUI log</span>' : inp('unit', h.unit)}</td>
    <td><button class="btn icon sm danger" data-rm title="Remove">×</button></td></tr>`;
  };
  $('#view').innerHTML = `
    <div class="eyebrow fade">Configuration</div><h2 class="fade" style="--i:1">Settings</h2>
    <div class="card fade" style="--i:2;margin-top:22px">
      <h3>Folders</h3>
      <div class="fields">
        <div class="field"><label>Generated models folder</label><input type="text" id="s_out" value="${esc(s.output_folder)}"></div>
        <div class="field"><label>Uploaded inputs folder</label><input type="text" id="s_in" value="${esc(s.input_folder)}"></div>
        <div class="field"><label>Job timeout (minutes)</label><input type="number" id="s_to" value="${s.job_timeout_min}" min="5" max="600"></div>
      </div>
    </div>
    <div class="card fade" style="--i:3;margin-top:18px">
      <h3>Joint detectors</h3>
      <div class="muted" style="font-size:12px;margin:4px 0 12px">Each rigged model's detector finds its joints in motion-job videos. Its exam errors are in % of the model's height: within the limits it's good, within the usable multiple it's usable, beyond that motion jobs fall back to point tracking.</div>
      <div class="fields">
        <div class="field"><label>Training renders (300–5000)</label><input type="number" id="s_dimg" value="${s.detector_images}" min="300" max="5000" step="100"></div>
        <div class="field"><label>Training epochs (10–120)</label><input type="number" id="s_dep" value="${s.detector_epochs}" min="10" max="120"></div>
        ${EXAM_ROWS.map(([k, l]) => `<div class="field"><label>Good: ${l} ≤ % (0.5–20)</label><input type="number" data-lim="${k}" value="${s.detector_limits[k]}" min="0.5" max="20" step="0.1"></div>`).join('')}
        <div class="field"><label>Usable up to × the limits (1–4)</label><input type="number" id="s_dux" value="${s.detector_usable_x}" min="1" max="4" step="0.1"></div>
        <div class="field check"><input type="checkbox" id="s_dauto" ${s.detector_auto_train ? 'checked' : ''}><label for="s_dauto">Train a detector when a model is rigged</label></div>
      </div>
    </div>
    <div class="card fade" style="--i:3;margin-top:18px;overflow-x:auto">
      <div style="display:flex;align-items:center;gap:10px"><h3>GPU hosts</h3><span class="muted" style="font-size:12px">ComfyUI servers reached over SSH. One job per host at a time.</span>
        <button class="btn sm" id="test" style="margin-left:auto">Test hosts</button><button class="btn sm" id="add">+ Add host</button></div>
      <table class="hosts"><thead><tr><th></th><th>On</th><th>Name</th><th>Type</th><th>SSH target / ComfyUI URL</th><th>GPU</th><th>Port</th><th>ComfyUI dir</th><th>Log unit</th><th></th></tr></thead>
        <tbody id="hrows">${s.hosts.map(row).join('')}</tbody></table>
      <div id="hstat" class="muted" style="font-size:12px;margin-top:10px"></div>
    </div>
    <div style="margin-top:18px;display:flex;justify-content:flex-end"><button class="btn primary" id="save">Save settings</button></div>
    <div class="card fade" style="--i:4;margin-top:18px" id="codex"></div>`;
  drawCodex();
  const read = () => ({
    output_folder: $('#s_out').value.trim(), input_folder: $('#s_in').value.trim(), job_timeout_min: +$('#s_to').value,
    detector_images: +$('#s_dimg').value, detector_epochs: +$('#s_dep').value, detector_usable_x: +$('#s_dux').value,
    detector_auto_train: $('#s_dauto').checked,
    detector_limits: Object.fromEntries([...document.querySelectorAll('[data-lim]')].map(el => [el.dataset.lim, +el.value])),
    hosts: [...document.querySelectorAll('#hrows tr')].map(rowData),
  });
  const rowData = tr => Object.fromEntries([...tr.querySelectorAll('[data-f]')].map(el =>
      [el.dataset.f, el.type === 'checkbox' ? el.checked : el.type === 'number' ? +el.value : el.value.trim()]));
  const wire = () => {
    document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => b.closest('tr').remove());
    document.querySelectorAll('[data-kind]').forEach(sel => sel.onchange = () => {
      const tr = sel.closest('tr'); tr.outerHTML = row(rowData(tr), tr.dataset.i); wire();
    });
  };
  wire();
  $('#add').onclick = () => {
    $('#hrows').insertAdjacentHTML('beforeend', row({ name: 'New host', ssh: 'user@host', gpu: 0, port: 8188, comfy_dir: '/home/user/ComfyUI', unit: 'comfyui', enabled: false }, Date.now()));
    wire();
  };
  $('#save').onclick = () => api('/api/settings', { method: 'PUT', body: JSON.stringify(read()) }).then(() => toast('Settings saved'), fail);
  $('#test').onclick = async () => {
    $('#hstat').textContent = 'Testing… (save first to test edited rows)';
    try {
      const hs = await api('/api/hosts');
      hs.forEach((h, i) => {
        const dot = document.querySelectorAll('#hrows [data-dot]')[i];
        if (dot) { dot.className = 'dot ' + (!h.ok ? 'bad' : h.busy || !h.trellis ? 'busy' : 'ok'); dot.title = h.detail; }
      });
      $('#hstat').innerHTML = hs.map(h => `<div><b>${esc(h.name)}</b>: ${esc(h.detail)}</div>`).join('');
    } catch (e) { fail(e); }
  };
}

// ChatGPT subscription sign-in (the Codex CLI's login), used by Images jobs. Tokens stay on the server.
async function drawCodex() {
  const box = $('#codex'); if (!box) return;
  let s; try { s = await api('/api/codex'); } catch (e) { return fail(e); }
  const until = s.expires ? new Date(s.expires * 1000).toLocaleString() : '';
  box.innerHTML = `<h3>ChatGPT subscription (Codex login)</h3>
    <div class="muted" style="font-size:12px;margin:4px 0 14px">Draws the Images jobs with your ChatGPT plan, as the Codex CLI does.</div>
    ${s.signed_in ? `<dl>
      <dt>Signed in</dt><dd>${esc(s.email || '—')}</dd><dt>Account id</dt><dd><code>${esc(s.account_id)}</code></dd>
      <dt>Access token</dt><dd><span class="pill ${s.valid ? 'done' : 'failed'}">${s.valid ? 'valid' : 'expired'}</span> until ${esc(until)}${!s.valid && s.refresh ? ' · refreshes on next use' : ''}</dd>
      <dt>Refresh token</dt><dd>${s.refresh ? 'stored' : 'none'}</dd></dl>
      <button class="btn sm danger" id="cx_out" style="margin-top:10px">Sign out</button>
      <div class="eyebrow" style="margin-top:20px">Sign in again</div>` : '<div class="eyebrow">Sign in</div>'}
    <button class="btn primary" id="cx_start" style="margin-top:10px">Step 1 · Sign in with ChatGPT</button>
    <div class="muted" style="font-size:12px;margin-top:6px">Opens the OpenAI sign-in in a popup. Make sure <code>codex login</code> isn't running on your computer at the same time: a CLI listening on port 1455 would take the callback before you can copy it.</div>
    <div class="field" style="margin-top:16px"><label for="cx_url">Step 2 · Paste the popup's address bar</label><input type="text" id="cx_url" autocomplete="off" placeholder="http://localhost:1455/auth/callback?code=..."></div>
    <div class="muted" style="font-size:12px;margin-top:6px">After you approve, the popup lands on a page that <b>fails to load</b> at <code>localhost:1455/auth/callback?…</code>. That's expected: nothing listens there. Copy its whole address bar, paste it here within 15 minutes, and close the popup. It's a one-time credential: used immediately, never stored or logged.</div>
    <button class="btn primary" id="cx_finish" style="margin-top:12px">Finish sign-in</button>
    <details class="sec" style="margin-top:14px"><summary>Import from the Codex CLI auth.json instead</summary>
      <textarea id="cx_json" rows="4" style="width:100%;margin-top:10px" placeholder="Paste the whole of ~/.codex/auth.json"></textarea>
      <button class="btn sm" id="cx_import" style="margin-top:8px">Import</button></details>`;
  const act = (path, body) => post(path, body).then(() => { toast('ChatGPT login updated'); drawCodex(); }, fail);
  $('#cx_out') && ($('#cx_out').onclick = () => act('/api/codex/signout'));
  $('#cx_start').onclick = async () => {
    const w = window.open('', 'chatgpt-signin', 'width=520,height=720');  // opened in the click, so it isn't blocked
    try { const r = await post('/api/codex/start'); w.location = r.url; } catch (e) { w?.close(); fail(e); }
  };
  $('#cx_finish').onclick = () => { const v = $('#cx_url').value.trim(); $('#cx_url').value = ''; act('/api/codex/finish', { url: v }); };
  $('#cx_import').onclick = () => { const v = $('#cx_json').value; $('#cx_json').value = ''; act('/api/codex/import', { auth_json: v }); };
}

/* ---------------- queue flyout */
const qOpen = { log: new Set(store.get('openLogs', [])), auto: store.get('autoScroll', true) };
function setQueueOpen(on) { $('#queue').classList.toggle('closed', !on); store.set('queueOpen', on); }
setQueueOpen(store.get('queueOpen', true));
$('#qtoggle').onclick = () => setQueueOpen($('#queue').classList.contains('closed'));
$('#vtab').onclick = () => setQueueOpen(true);
$('#qclear').onclick = () => post('/api/jobs/clear').then(pollQueue, fail);
const metric = (lbl, pct, extra) => `<div class="metric"><div class="lbl">${lbl}<b>${pct == null ? '—' : extra || pct + '%'}</b></div><div class="bar"><i style="width:${pct ?? 0}%"></i></div></div>`;
let qTimer;
async function pollQueue() {
  clearTimeout(qTimer);
  try { drawQueue(await api('/api/queue')); } catch {}
  qTimer = setTimeout(pollQueue, 2000);
}
let detJobs = null;
function drawQueue(jobs) {
  const det = jobs.filter(j => j.kind === 'detector').map(j => j.id + j.status).join();  // badges follow detector jobs
  if (detJobs !== null && det !== detJobs && (location.hash.startsWith('#/assets') || !location.hash)) renderAssets();
  detJobs = det;
  const active = jobs.filter(j => ['queued', 'running', 'cancelling'].includes(j.status));
  $('#qcount').textContent = active.length;
  $('#qcount').style.visibility = active.length ? 'visible' : 'hidden';
  const body = $('#qbody'), now = Date.now() / 1000;
  const scrolls = {};
  body.querySelectorAll('.log pre').forEach(p => scrolls[p.dataset.id] = [p.scrollTop, p.scrollHeight - p.clientHeight - p.scrollTop < 4]);
  body.innerHTML = jobs.length ? jobs.map(j => {
    const live = j.status === 'running' || j.status === 'cancelling';
    const m = j.metrics, open = qOpen.log.has(j.id);
    const time = j.started ? dur((j.finished || now) - j.started) : 'queued ' + fmtTime(j.created);
    return `<div class="job ${live ? 'running' : ''}" style="animation:none">
      <div class="row"><span class="title" title="${esc(j.name)}">${esc(j.name)}</span><span class="pill ${j.status}">${j.status}</span></div>
      <div class="sub">${{ motion: 'Motion', rig: 'Rig', image: 'Images', detector: 'Detector' }[j.kind] || '3D Asset'} · #${j.id}${j.host ? ' · ' + esc(j.host) : ''} · ${time}${j.note && (j.status === 'queued' || live) ? ' · ' + esc(j.note) : ''}</div>
      ${j.error ? `<div class="err">${esc(j.error)}</div>` : ''}
      ${j.kind === 'motion' && j.detector?.state === 'failed' ? `<div class="err">The model's joint detector failed its exam, so this job tracked with CoTracker: the legs may move together. Its files include the exam overlay video.</div>` : ''}      ${live && m ? `<div class="metrics">${metric('CPU', m.cpu)}${metric('RAM', m.ram, m.ram_gb.join(' / ') + ' GB')}${metric('GPU', m.gpu)}${metric('VRAM', m.vram, m.vram_gb.join(' / ') + ' GB')}</div>` : ''}
      ${j.log.length || live ? `<div class="log ${open ? 'open' : ''}"><pre data-id="${j.id}">${esc(open ? j.log.join('\n') : j.log.at(-1) || 'waiting for output…')}</pre>
        <div class="lbar"><a href="#" data-log="${j.id}">${open ? 'Collapse log' : 'Expand log'}</a>${open ? `<label><input type="checkbox" data-auto ${qOpen.auto ? 'checked' : ''}>Auto-scroll</label>` : ''}<span style="margin-left:auto">${j.log.length} lines</span></div></div>` : ''}
      <div class="acts">
        ${['queued', 'running'].includes(j.status) ? `<button class="btn sm danger" data-act="cancel" data-id="${j.id}">Cancel</button>` : ''}
        ${['failed', 'cancelled'].includes(j.status) ? `<button class="btn sm" data-act="retry" data-id="${j.id}">Retry</button>` : ''}
        ${j.output ? `<a class="btn sm primary" href="${assetHref(j.output.split('/').slice(0, -1).join('/'))}">Open in Assets</a>` : ''}
        ${j.kind === 'image' && j.status === 'done' ? `<button class="btn sm" data-use="${j.id}">Make 3D asset</button>` : ''}
        ${!live && j.status !== 'queued' ? `<button class="btn sm" data-act="remove" data-id="${j.id}" style="margin-left:auto">Remove</button>` : ''}
      </div></div>`;
  }).join('') : '<div class="empty" style="padding:40px 16px">No jobs yet. Start one from Create.</div>';
  body.querySelectorAll('.log pre').forEach(p => {
    const prev = scrolls[p.dataset.id];
    p.scrollTop = qOpen.auto || !prev ? p.scrollHeight : prev[0];
  });
  body.querySelectorAll('[data-log]').forEach(a => a.onclick = e => {
    e.preventDefault(); const id = +a.dataset.log;
    qOpen.log.has(id) ? qOpen.log.delete(id) : qOpen.log.add(id); store.set('openLogs', [...qOpen.log]); drawQueue(jobs);
  });
  body.querySelectorAll('[data-auto]').forEach(c => c.onchange = () => { qOpen.auto = c.checked; store.set('autoScroll', c.checked); });
  body.querySelectorAll('[data-act]').forEach(b => b.onclick = () => post(`/api/jobs/${b.dataset.id}/${b.dataset.act}`).then(pollQueue, fail));
  body.querySelectorAll('[data-use]').forEach(b => b.onclick = () => useImages(jobs.find(j => j.id === +b.dataset.use)));
}

window.addEventListener('hashchange', route);
route();
pollQueue();
</script>
</body>
