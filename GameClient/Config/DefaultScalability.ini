; GFX-01: group levels 0/2/3 map to Compatibility/Standard/Enhanced.
; r.AntiAliasingMethod is not ECVF_Scalability (ensure if set here); TSR comes from DefaultEngine.ini for all tiers.

[GlobalIlluminationQuality@0]
r.DynamicGlobalIlluminationMethod=2
r.Lumen.HardwareRayTracing=0
r.SSGI.Quality=2

[GlobalIlluminationQuality@2]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.HardwareRayTracing=0

[GlobalIlluminationQuality@3]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.HardwareRayTracing=1

[ReflectionQuality@0]
r.ReflectionMethod=2

[ReflectionQuality@2]
r.ReflectionMethod=1

[ReflectionQuality@3]
r.ReflectionMethod=1

[ShadowQuality@0]
r.Shadow.Virtual.Enable=0

[ShadowQuality@2]
r.Shadow.Virtual.Enable=1

[ShadowQuality@3]
r.Shadow.Virtual.Enable=1