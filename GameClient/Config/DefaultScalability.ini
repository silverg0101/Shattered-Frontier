; GFX-01: group levels 0/2/3 map to Compatibility/Standard/Enhanced.
; Only ECVF_Scalability cvars belong here (others ensure on every run). Method cvars (r.AntiAliasingMethod,
; r.DynamicGlobalIlluminationMethod, r.ReflectionMethod, r.Lumen.HardwareRayTracing) live in DefaultEngine.ini;
; BaseScalability already turns Lumen GI/reflections off at quality 0 via r.Lumen.*.Allow.

[GlobalIlluminationQuality@0]
r.SSGI.Quality=2

[ShadowQuality@0]
r.Shadow.Virtual.Enable=0

[ShadowQuality@2]
r.Shadow.Virtual.Enable=1

[ShadowQuality@3]
r.Shadow.Virtual.Enable=1
