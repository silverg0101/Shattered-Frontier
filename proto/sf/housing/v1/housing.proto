syntax = "proto3";
package sf.housing.v1;
option csharp_namespace = "ShatteredFrontier.Housing.V1";

service Housing {
  rpc ClaimPlot(ClaimPlotRequest) returns (ClaimReply);
  rpc Place(PlaceRequest) returns (PlacementReply);
  rpc Remove(RemoveRequest) returns (PlacementReply);
  rpc GetClaim(GetClaimRequest) returns (ClaimReply);
  rpc ListStructures(ListStructuresRequest) returns (ListStructuresReply);
  rpc Grant(GrantRequest) returns (ClaimReply);
}
message ListStructuresRequest { string claim_id = 1; }
message StructureCell { int32 x = 1; int32 y = 2; int32 z = 3; }
// BLD-01 orientation_index: 0 is identity. Indices 1..23 enumerate the other
// proper signed-axis rotations by lexicographic order of the ordered images
// of local +X,+Y,+Z. The same index is persisted and returned unchanged.
message Structure {
  string structure_id = 1;
  StructureCell cell = 2;
  string content_id = 3;
  int64 revision = 4;
  string shape_key = 5;
  int32 orientation_index = 6;
}
message ListStructuresReply {
  repeated Structure structures = 1;
  int64 structure_revision = 2;
  // One bit per 1 m cell, row major from (mask_origin_x,mask_origin_y).
  bytes claim_mask = 3;
  int32 mask_origin_x = 4;
  int32 mask_origin_y = 5;
  int32 mask_width = 6;
  int32 mask_height = 7;
}
message GrantRequest {
  string operation_id = 1;
  string claim_id = 2;
  string actor_id = 3;
  string target_id = 4;
  int32 rights = 5;
  int64 expected_permission_revision = 6;
}
message ClaimPlotRequest {
  string operation_id = 1;
  string claim_id = 2;
  string owner_id = 3;
  double center_x = 4;
  double center_y = 5;
  int32 side_metres = 6;
  int32 prepaid_days = 7;
  int64 expected_world_revision = 8;
}
message GetClaimRequest { string claim_id = 1; }
message ClaimReply {
  string claim_id = 1;
  string owner_id = 2;
  string state = 3;
  int64 revision = 4;
  int64 permission_revision = 5;
  int64 funded_until_unix_ms = 6;
}
message PlaceRequest {
  string operation_id = 1;
  string claim_id = 2;
  string actor_id = 3;
  int64 expected_permission_revision = 4;
  int64 expected_structure_revision = 5;
  string structure_id = 6;
  int32 cell_x = 7;
  int32 cell_y = 8;
  int32 cell_z = 9;
  string content_id = 10;
  string material_id = 11;
  int64 material_quantity = 12;
  string container_id = 13;
  int64 expected_container_revision = 14;
  optional string shape_key = 15;
  int32 orientation_index = 16;
}
message RemoveRequest {
  string operation_id = 1;
  string claim_id = 2;
  string actor_id = 3;
  string structure_id = 4;
  int64 expected_permission_revision = 5;
  int64 expected_structure_revision = 6;
  int64 expected_container_revision = 7;
  string removal_kind = 8;
}
message PlacementReply {
  string operation_id = 1;
  string state = 2;
  string structure_id = 3;
  int64 structure_revision = 4;
  string consume_operation_id = 5;
  string shape_key = 6;
  int32 orientation_index = 7;
}
