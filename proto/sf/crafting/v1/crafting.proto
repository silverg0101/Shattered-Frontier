syntax = "proto3";
package sf.crafting.v1;
option csharp_namespace = "ShatteredFrontier.Crafting.V1";

service Crafting { rpc Craft(CraftRequest) returns (CraftReply); }
message CraftRequest {
  string operation_id = 1;
  string character_id = 2;
  string container_id = 3;
  string recipe_id = 4;
  int64 expected_container_revision = 5;
  int32 count = 6;
}
message CraftReply {
  string operation_id = 1;
  int64 container_revision = 2;
  repeated ItemChange changes = 3;
}
message ItemChange { string definition_id = 1; int64 delta = 2; }
