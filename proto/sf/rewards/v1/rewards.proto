syntax = "proto3";
package sf.rewards.v1;
option csharp_namespace = "ShatteredFrontier.Rewards.V1";

service Rewards {
  rpc GrantDefeatReward(GrantDefeatRewardRequest) returns (RewardReceipt);
  rpc CreateSharedDefeatDrop(CreateSharedDefeatDropRequest) returns (SharedDefeatDropReceipt);
  rpc ClaimSharedDefeatDrop(ClaimSharedDefeatDropRequest) returns (SharedDefeatDropReceipt);
}

message CreateSharedDefeatDropRequest {
  string defeat_event_id = 1;
  string creature_id = 2;
  string table_id = 3;
  string killer_character_id = 4;
  repeated string eligible_character_ids = 5;
  bool killer_in_protected_town = 6;
  bool creature_in_protected_town = 7;
}

message ClaimSharedDefeatDropRequest {
  string defeat_event_id = 1;
  string character_id = 2;
  string container_id = 3;
}

message SharedDropItem {
  string definition_id = 1;
  int64 quantity = 2;
}

message SharedDefeatDropReceipt {
  string defeat_event_id = 1;
  repeated SharedDropItem items = 2;
  string claimant_character_id = 3;
  string ledger_operation_id = 4;
  int64 container_revision = 5;
}

message GrantDefeatRewardRequest {
  string defeat_event_id = 1;
  string killer_character_id = 2;
  string recipient_character_id = 3;
  string container_id = 4;
  int64 expected_container_revision = 5;
  bool killer_in_protected_town = 6;
  bool boar_in_protected_town = 7;
  string table_id = 8;
  string creature_id = 9;
}

message RewardReceipt {
  bool granted = 1;
  string source_code = 2;
  string ledger_operation_id = 3;
  string definition_id = 4;
  int64 quantity = 5;
  int64 container_revision = 6;
  repeated SharedDropItem items = 7;
}
