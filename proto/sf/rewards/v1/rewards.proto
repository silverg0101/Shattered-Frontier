syntax = "proto3";
package sf.rewards.v1;
option csharp_namespace = "ShatteredFrontier.Rewards.V1";

service Rewards {
  rpc GrantDefeatReward(GrantDefeatRewardRequest) returns (RewardReceipt);
  rpc CreateSharedDefeatDrop(CreateSharedDefeatDropRequest) returns (SharedDefeatDropReceipt);
  rpc ClaimSharedDefeatDrop(ClaimSharedDefeatDropRequest) returns (SharedDefeatDropReceipt);
  rpc CreateCorpseLoot(CreateCorpseLootRequest) returns (LootSourcesReply);
  rpc ListLootSources(ListLootSourcesRequest) returns (LootSourcesReply);
  rpc OpenLootSource(OpenLootSourceRequest) returns (LootSourceView);
  rpc TakeLoot(TakeLootRequest) returns (LootSourceView);
  rpc DropLoot(DropLootRequest) returns (LootSourceView);
}

// Trusted zone-server API. Range/LOS and actual pawn location are admitted by
// the authority immediately before dispatch; clients cannot call this channel.
message LootMeshBounds {
  double origin_x_cm = 1; double origin_y_cm = 2; double origin_z_cm = 3;
  double extent_x_cm = 4; double extent_y_cm = 5; double extent_z_cm = 6;
}
message LootSource {
  string id = 1;
  string zone_id = 2;
  double x_cm = 3;
  double y_cm = 4;
  double z_cm = 5;
  string creature_id = 6;
  string mesh_path = 7;
  bool ground = 8;
  bool shared = 9;
  repeated string eligible_character_ids = 10;
  double scale_x = 11; double scale_y = 12; double scale_z = 13;
  double pitch = 14; double yaw = 15; double roll = 16;
  string body_id = 17; // opaque authoritative defeat ID; personal views share one physical body
  LootMeshBounds mesh_bounds = 18; // optional for historical rows; asset-local, before scale
}
message LootInstance { string instance_id = 1; string definition_id = 2; int32 durability_percent = 3; }
message LootSourceView {
  LootSource source = 1;
  int64 revision = 2;
  repeated SharedDropItem items = 3;
  repeated LootInstance instances = 4;
  string ledger_operation_id = 5;
  int64 backpack_revision = 6;
}
message CreateCorpseLootRequest {
  string defeat_event_id = 1;
  string creature_id = 2;
  string table_id = 3;
  string killer_character_id = 4;
  repeated string eligible_character_ids = 5;
  bool protected = 6;
  string zone_id = 7;
  double x_cm = 8; double y_cm = 9; double z_cm = 10;
  string mesh_path = 11;
  bool shared = 12;
  string raid_group_id = 13;
  double scale_x = 14; double scale_y = 15; double scale_z = 16;
  double pitch = 17; double yaw = 18; double roll = 19;
  LootMeshBounds mesh_bounds = 20;
}
message ListLootSourcesRequest { string zone_id = 1; }
message LootSourcesReply { repeated LootSourceView sources = 1; }
message OpenLootSourceRequest { string source_id = 1; string character_id = 2; }
message TakeLootRequest {
  string operation_id = 1; string source_id = 2; string character_id = 3;
  string backpack_id = 4; int64 source_revision = 5; int64 backpack_revision = 6;
  string definition_id = 7; int64 quantity = 8; string instance_id = 9;
}
message DropLootRequest {
  string operation_id = 1; string character_id = 2; string backpack_id = 3;
  int64 backpack_revision = 4; string definition_id = 5; int64 quantity = 6;
  string instance_id = 7; string zone_id = 8;
  double x_cm = 9; double y_cm = 10; double z_cm = 11; string mesh_path = 12;
}

message CreateSharedDefeatDropRequest {
  string defeat_event_id = 1;
  string creature_id = 2;
  string table_id = 3;
  string killer_character_id = 4;
  repeated string eligible_character_ids = 5;
  bool killer_in_protected_town = 6;
  bool creature_in_protected_town = 7;
  string raid_group_id = 8;
}

message ClaimSharedDefeatDropRequest {
  string defeat_event_id = 1;
  string character_id = 2;
  string container_id = 3;
}

message SharedDropItem {
  string definition_id = 1;
  int64 quantity = 2;
}

message SharedDefeatDropReceipt {
  string defeat_event_id = 1;
  repeated SharedDropItem items = 2;
  string claimant_character_id = 3;
  string ledger_operation_id = 4;
  int64 container_revision = 5;
  string raid_group_id = 6;
}

message GrantDefeatRewardRequest {
  string defeat_event_id = 1;
  string killer_character_id = 2;
  string recipient_character_id = 3;
  string container_id = 4;
  int64 expected_container_revision = 5;
  bool killer_in_protected_town = 6;
  bool boar_in_protected_town = 7;
  string table_id = 8;
  string creature_id = 9;
}

message RewardReceipt {
  bool granted = 1;
  string source_code = 2;
  string ledger_operation_id = 3;
  string definition_id = 4;
  int64 quantity = 5;
  int64 container_revision = 6;
  repeated SharedDropItem items = 7;
}
