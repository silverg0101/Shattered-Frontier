syntax = "proto3";
package sf.gathering.v1;
option csharp_namespace = "ShatteredFrontier.Gathering.V1";

service Gathering {
  rpc GetNode(GetNodeRequest) returns (NodeReply);
  rpc ListZoneNodes(ListZoneNodesRequest) returns (ListZoneNodesReply);
  rpc Harvest(HarvestRequest) returns (HarvestReply);
  // Separate method so an older host cannot silently discard the required intent fields.
  rpc HarvestWithIntent(HarvestRequest) returns (HarvestReply);
}
message GetNodeRequest { string node_id = 1; }
message ListZoneNodesRequest { string zone_id = 1; }
message ListZoneNodesReply { repeated NodeReply nodes = 1; }
message HarvestRequest {
  string operation_id = 1;
  string character_id = 2;
  string node_id = 3;
  int32 generation = 4;
  // Required for durable harvests. The host owns the ledger grant and its INT-06 follow-up.
  string container_id = 5;
  bytes follow_up_payload = 6;
  string follow_up_digest = 7;
  int32 follow_up_version = 8;
}
message NodeReply {
  string node_id = 1;
  string definition_id = 2;
  int32 generation = 3;
  int32 charges = 4;
  int32 max_charges = 5;
  int64 regrow_at_unix_ms = 6;
  string growth_stage = 7;
  int64 next_transition_unix_ms = 8;
  string pool_id = 9;
  string point_id = 10;
  double position_x_m = 11;
  double position_y_m = 12;
  double position_z_m = 13;
  double facing_degrees = 14;
  bool active = 15;
}
message HarvestReply {
  // granted | pending | depleted | stale_generation | unknown_node
  string status = 1;
  string resource_id = 2;
  int32 quantity = 3;
  NodeReply node = 4;
}
