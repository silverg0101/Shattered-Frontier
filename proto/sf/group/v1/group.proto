syntax = "proto3";
package sf.group.v1;
option csharp_namespace = "ShatteredFrontier.Group.V1";

// Trusted zone-server calls. Identities are resolved by that server, never by clients.
service GroupService {
  rpc CreateParty(CreatePartyRequest) returns (Party);
  rpc JoinParty(JoinPartyRequest) returns (Party);
  rpc LeaveParty(MemberActionRequest) returns (Party);
  rpc KickMember(MemberActionRequest) returns (Party);
  rpc PromoteLeader(MemberActionRequest) returns (Party);
  rpc AssignAssistant(MemberActionRequest) returns (Party);
  rpc GetPartyForCharacter(CharacterRef) returns (Party);
  rpc CreateRaid(CreateRaidRequest) returns (Raid);
  rpc AddPartyToRaid(AddPartyToRaidRequest) returns (Raid);
}
message CreateRaidRequest {
  string idempotency_key = 1;
  string party_id = 2;
  string actor_character_id = 3;
}
message AddPartyToRaidRequest {
  string idempotency_key = 1;
  string raid_group_id = 2;
  string party_id = 3;
  string actor_character_id = 4;
  string joining_party_leader_character_id = 5;
}
message Raid {
  string raid_group_id = 1;
  repeated string party_ids = 2;
  repeated string member_character_ids = 3;
}
message CreatePartyRequest {
  string idempotency_key = 1;
  string leader_character_id = 2;
  string account_id = 3;
  string realm_id = 4;
  string dc_region = 5;
}
message JoinPartyRequest {
  string idempotency_key = 1;
  string party_id = 2;
  string actor_character_id = 3;
  string character_id = 4;
  string account_id = 5;
  string realm_id = 6;
}
message MemberActionRequest {
  string idempotency_key = 1;
  string party_id = 2;
  string actor_character_id = 3;
  string character_id = 4;
}
message CharacterRef { string character_id = 1; }
message Party {
  string party_id = 1;
  string leader_character_id = 2;
  string assistant_character_id = 3;
  repeated string member_character_ids = 4;
  int32 version = 5;
  string state = 6;
  string raid_group_id = 7;
  repeated string raid_member_character_ids = 8;
}
