syntax = "proto3";
package sf.progression.v1;
option csharp_namespace = "ShatteredFrontier.Progression.V1";

service Progression {
  rpc CreateCharacter(CreateCharacterRequest) returns (CreateCharacterReply);
  rpc ApplyReceipt(ApplyReceiptRequest) returns (ApplyReceiptReply);
  rpc GetCharacterState(GetCharacterStateRequest) returns (CharacterStateReply);
  rpc SavePosition(SavePositionRequest) returns (SavePositionReply);
  rpc CommitUnstuck(CommitUnstuckRequest) returns (SavePositionReply);
  rpc ReportDeath(ReportDeathRequest) returns (DeathState);
  rpc ClearDeath(ClearDeathRequest) returns (DeathState);
  rpc LearnRecipe(LearnRecipeRequest) returns (LearnRecipeReply);
  rpc EndSession(EndSessionRequest) returns (EndSessionReply);
  rpc ChangeSkillLock(ChangeSkillLockRequest) returns (ChangeSkillLockReply);
}
// Trusted zone-server mutation. The server verifies that its requesting controller
// owns character_id before calling this route.
message ChangeSkillLockRequest {
  string operation_id = 1;
  string character_id = 2;
  int64 expected_progression_revision = 3;
  string skill_id = 4;
  string lock = 5; // up | down | locked
}
message ChangeSkillLockReply {
  int64 progression_revision = 1;
  string skill_id = 2;
  string lock = 3;
  int64 ready_at_unix_ms = 4;
}
message EndSessionRequest {
  string operation_id = 1;
  string character_id = 2;
  int64 expected_progression_revision = 3;
  bool in_rest_area = 4;
}
message EndSessionReply { int64 progression_revision = 1; double rested_minutes = 2; }
message CreateCharacterRequest {
  string character_id = 1;
  optional bytes appearance_packet = 2;
  string archetype_id = 3;
}
message CreateCharacterReply { int64 appearance_revision = 1; }
message LearnRecipeRequest {
  string operation_id = 1;
  string character_id = 2;
  string recipe_id = 3;
  string source = 4;
  string trainer_npc = 5;
  string scroll_container = 6;
  int64 expected_container_revision = 7;
}
message LearnRecipeReply { string recipe_id = 1; int64 progression_revision = 2; int64 cost_copper = 3; }
message KnownRecipe { string recipe_id = 1; string source = 2; int64 learned_at_unix_ms = 3; }

message ApplyReceiptRequest {
  string source_receipt_id = 1;
  string kind = 2;
  string character_id = 3;
  int64 expected_progression_revision = 4;
  int64 expected_quest_revision = 5;
  ActionPayload payload = 6;
  QuestEvidence quest = 7;
}
message ActionPayload {
  string skill_id = 1;
  int32 difficulty = 2;
  double action_seconds = 3;
  uint64 context_hash = 4;
  bool success = 5;
  int32 enemy_level = 6;
  double enemy_tier_multiplier = 7;
  int32 eligible_party_size = 8;
  // Final accepted practice receipt may close the session atomically.
  bool session_end = 9;
    bool in_rest_area = 10;
    // Highest level among eligible party members on a trusted zone-server kill; 0 for legacy solo receipts.
    int32 reference_party_level = 11;
    bool xp_eligible = 12; // Combat practice producer asserts a hostile, damageable target.
}
// kind: gather | craft | build | defeat | talk_resident | talk_npc (progress evidence for step_id),
// or accept | abandon (QST-02; step_id and target_id empty, quantity 0).
message QuestEvidence {
  string quest_id = 1;
  string step_id = 2;
  string kind = 3;
  string target_id = 4;
  string node_id = 5;
  int32 quantity = 6;
  int64 occurred_at_unix_ms = 7;
}
message ApplyReceiptReply {
  bool progression_applied = 1;
  int32 skill_gain = 2;
  int32 xp_gain = 3;
  int32 level = 4;
  int64 progression_revision = 5;
  bool quest_accepted = 6;
  string active_step_id = 7;
  bool quest_completed = 8;
  int64 quest_revision = 9;
  repeated string reward_bundle_ids = 10;
  repeated GrantedItem granted_items = 11;
  // Why quest evidence was not accepted (duplicate, completed, prerequisite_missing, not_active, ...); empty when accepted.
  string quest_reason = 12;
  double rested_minutes = 13;
  CombatAttributes combat_attributes = 14;
  map<string, int32> skills = 15; // Effective current values after this receipt.
  map<string, string> gathering_skill_locks = 16;
  map<string, int64> gathering_skill_lock_ready_at_unix_ms = 17;
  bool gathering_skill_locks_authoritative = 18;
}
message CombatAttributes {
  string archetype = 1;
  int32 level = 2;
  int32 strength = 3;
  int32 dexterity = 4;
  int32 constitution = 5;
  int32 intelligence = 6;
  int32 wisdom = 7;
  int32 willpower = 8;
}
message GrantedItem {
  string definition_id = 1;
  int64 quantity = 2;
}
message GetCharacterStateRequest { string character_id = 1; }
message CharacterPosition {
  string zone_id = 1;
  double x = 2;
  double y = 3;
  double z = 4;
  float yaw = 5;
}
message SavePositionRequest {
  string character_id = 1;
  int64 expected_position_revision = 2;
  CharacterPosition position = 3;
}
message SavePositionReply { int64 position_revision = 1; }
message CommitUnstuckRequest {
  string character_id = 1;
  CharacterPosition position = 2;
  int32 cooldown_seconds = 3;
  string operation_id = 4;
}
message ReportDeathRequest {
  string death_event_id = 1;
  string character_id = 2;
  int64 occurred_at_unix_ms = 3;
  CharacterPosition death_position = 4;
  CharacterPosition respawn_position = 5;
  int32 respawn_delay_ms = 6;
}
message ClearDeathRequest { string character_id = 1; string death_event_id = 2; bool resurrect_at_death_position = 3; }
message DeathState {
  bool is_dead = 1;
  string death_event_id = 2;
  int64 occurred_at_unix_ms = 3;
  int64 respawn_at_unix_ms = 4;
  CharacterPosition death_position = 5;
  CharacterPosition respawn_position = 6;
}
message CharacterStateReply {
  int64 progression_revision = 1;
  int64 lifetime_xp = 2;
  int32 level = 3;
  map<string, int32> skills = 4;
  int64 quest_revision = 5;
  string active_step_id = 6;
  bool quest_completed = 7;
  map<string, int32> objective_counts = 8;
  CharacterPosition position = 9;
  int64 position_revision = 10;
  // QST-02: every quest row of the character (fields 5-8 describe quest/frontier_founder only).
  repeated QuestState quests = 11;
  repeated KnownRecipe known_recipes = 12;
  optional bytes appearance_packet = 13;
  optional string face_id = 14;
  // Authoritative gathering values after committed harvest receipts.
  map<string, int32> gathering_skills = 15;
  DeathState death = 16;
  double rested_minutes = 17;
  CombatAttributes combat_attributes = 18;
  map<string, string> gathering_skill_locks = 19;
  map<string, int64> gathering_skill_lock_ready_at_unix_ms = 20;
  bool gathering_skill_locks_authoritative = 21;
}
message QuestState {
  string quest_id = 1;
  string state = 2;  // active | completed | abandoned
  string active_step_id = 3;
  map<string, int32> counts = 4;
  int32 content_revision = 5;
  int64 revision = 6;
  bool reward_pending = 7;  // a reward intent of this quest is not yet in the backpack (full backpack, host down)
}
