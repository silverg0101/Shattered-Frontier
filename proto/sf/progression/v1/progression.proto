syntax = "proto3";
package sf.progression.v1;
option csharp_namespace = "ShatteredFrontier.Progression.V1";

service Progression {
  rpc ApplyReceipt(ApplyReceiptRequest) returns (ApplyReceiptReply);
  rpc GetCharacterState(GetCharacterStateRequest) returns (CharacterStateReply);
  rpc SavePosition(SavePositionRequest) returns (SavePositionReply);
  rpc LearnRecipe(LearnRecipeRequest) returns (LearnRecipeReply);
}
message LearnRecipeRequest {
  string operation_id = 1;
  string character_id = 2;
  string recipe_id = 3;
  string source = 4;
  string trainer_npc = 5;
  string scroll_container = 6;
  int64 expected_container_revision = 7;
}
message LearnRecipeReply { string recipe_id = 1; int64 progression_revision = 2; int64 cost_copper = 3; }
message KnownRecipe { string recipe_id = 1; string source = 2; int64 learned_at_unix_ms = 3; }

message ApplyReceiptRequest {
  string source_receipt_id = 1;
  string kind = 2;
  string character_id = 3;
  int64 expected_progression_revision = 4;
  int64 expected_quest_revision = 5;
  ActionPayload payload = 6;
  QuestEvidence quest = 7;
}
message ActionPayload {
  string skill_id = 1;
  int32 difficulty = 2;
  double action_seconds = 3;
  uint64 context_hash = 4;
  bool success = 5;
  int32 enemy_level = 6;
  double enemy_tier_multiplier = 7;
  int32 eligible_party_size = 8;
}
// kind: gather | craft | build | defeat | talk_resident | talk_npc (progress evidence for step_id),
// or accept | abandon (QST-02; step_id and target_id empty, quantity 0).
message QuestEvidence {
  string quest_id = 1;
  string step_id = 2;
  string kind = 3;
  string target_id = 4;
  string node_id = 5;
  int32 quantity = 6;
  int64 occurred_at_unix_ms = 7;
}
message ApplyReceiptReply {
  bool progression_applied = 1;
  int32 skill_gain = 2;
  int32 xp_gain = 3;
  int32 level = 4;
  int64 progression_revision = 5;
  bool quest_accepted = 6;
  string active_step_id = 7;
  bool quest_completed = 8;
  int64 quest_revision = 9;
  repeated string reward_bundle_ids = 10;
  repeated GrantedItem granted_items = 11;
  // Why quest evidence was not accepted (duplicate, completed, prerequisite_missing, not_active, ...); empty when accepted.
  string quest_reason = 12;
}
message GrantedItem {
  string definition_id = 1;
  int64 quantity = 2;
}
message GetCharacterStateRequest { string character_id = 1; }
message CharacterPosition {
  string zone_id = 1;
  double x = 2;
  double y = 3;
  double z = 4;
  float yaw = 5;
}
message SavePositionRequest {
  string character_id = 1;
  int64 expected_position_revision = 2;
  CharacterPosition position = 3;
}
message SavePositionReply { int64 position_revision = 1; }
message CharacterStateReply {
  int64 progression_revision = 1;
  int64 lifetime_xp = 2;
  int32 level = 3;
  map<string, int32> skills = 4;
  int64 quest_revision = 5;
  string active_step_id = 6;
  bool quest_completed = 7;
  map<string, int32> objective_counts = 8;
  CharacterPosition position = 9;
  int64 position_revision = 10;
  // QST-02: every quest row of the character (fields 5-8 describe quest/frontier_founder only).
  repeated QuestState quests = 11;
  repeated KnownRecipe known_recipes = 12;
}
message QuestState {
  string quest_id = 1;
  string state = 2;  // active | completed | abandoned
  string active_step_id = 3;
  map<string, int32> counts = 4;
  int32 content_revision = 5;
  int64 revision = 6;
  bool reward_pending = 7;  // a reward intent of this quest is not yet in the backpack (full backpack, host down)
}
