syntax = "proto3";
package sf.world.v1;
option csharp_namespace = "ShatteredFrontier.World.V1";

service WorldSlots {
  rpc Advance(AdvanceSlotsRequest) returns (AdvanceSlotsReply);
}

message AdvanceSlotsRequest {
  string command = 1; // tick | defeat
  string group_id = 2;
  int32 slot_index = 3;
  int32 players_in_area = 4;
  bool hostile_spawning = 5;
}

message BoarSlot {
  string group_id = 1;
  int32 slot_index = 2;
  int32 cycle = 3;
  bool active = 4;
  string point_id = 5;
  double x_metres = 6;
  double y_metres = 7;
  double facing_degrees = 8;
}

message AdvanceSlotsReply { repeated BoarSlot slots = 1; }
